[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.5.3",
    "numpy>=2.1.0",
    "pandas>=2.0.0",
    "litestar[standard]>=2.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]

[tool.setuptools]
packages = ["app"]

# Include data files in the package
[tool.setuptools.package-data]
app = ["../data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"